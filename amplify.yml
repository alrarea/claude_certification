version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
        # The Lambda Function URL is only known after the backend phase runs
        # (unlike Amplify's own predictable app/branch domain) - read it from
        # the backend's output file rather than hardcoding it.
        - export VITE_API_URL=$(node -e "console.log(require('./amplify_outputs.json').custom.apiUrl)")
    build:
      commands:
        - npm run build --workspace=apps/web
  artifacts:
    baseDirectory: apps/web/dist
    files:
      - "**/*"
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
      - apps/web/node_modules/**/*
